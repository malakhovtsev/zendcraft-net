# CloudFront is the only client: it forwards zendcraft.net/api/* here.
server {
    listen 80 default_server;

    # Re-resolve the api container through Docker's DNS, so a redeployed
    # container with a new IP is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
    }

    location / {
        return 404;
    }
}

# Production pulls API_IMAGE from ECR; locally `docker compose up --build`
# builds it from ./backend.
name: zendcraft

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    image: ${API_IMAGE:-zendcraft-api}
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    init: true
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

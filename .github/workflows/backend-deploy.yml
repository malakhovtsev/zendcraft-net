name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_ROLE_ARN: arn:aws:iam::476287788555:role/zendcraft-github-deploy
  IMAGE_REPOSITORY: zendcraft-api
  FUNCTION_NAME: zendcraft-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Point the function at the new image
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.ecr.outputs.registry }}/${IMAGE_REPOSITORY}:${{ github.sha }}" \
            --query LastUpdateStatus --output text

          # Fails the job if Lambda can't use the new image.
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

      # Through CloudFront, like a visitor. Any real status counts, so the game
      # server being down doesn't fail the deploy.
      - name: Check the live API
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 15 \
            https://zendcraft.net/api/java-server-status | grep -q '"online":'

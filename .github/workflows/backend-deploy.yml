name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'nginx/**'
      - 'compose.yaml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_ROLE_ARN: arn:aws:iam::476287788555:role/zendcraft-github-deploy
  ARTIFACTS_BUCKET: zendcraft-deploy-artifacts-476287788555
  INSTANCE_ID: i-0cf04dcdd635c4d73
  IMAGE_REPOSITORY: zendcraft-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Upload release bundle
        run: |
          tar -czf release.tar.gz compose.yaml nginx
          aws s3 cp release.tar.gz "s3://${ARTIFACTS_BUCKET}/backend/${{ github.sha }}.tar.gz"

      - name: Start the release on the instance
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name zendcraft-deploy-backend \
            --parameters "ArtifactKey=backend/${{ github.sha }}.tar.gz" \
            --comment "Deploy ${{ github.sha }}" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text

          status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          test "$status" = "Success"

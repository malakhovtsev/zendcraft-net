name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create version.txt with current commit SHA
        run: echo "${{ github.sha }}" > ./backend/version.txt

      - name: Make SSH directory
        run: mkdir -p $HOME/.ssh

      - name: Add SSH private key
        run: echo "${{ secrets.EC2_SSH_KEY }}" > $HOME/.ssh/id_rsa

      - name: Fix SSH key permissions
        run: chmod 600 $HOME/.ssh/id_rsa

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> $HOME/.ssh/known_hosts

      - name: Deploy backend to EC2
        run: |
          rsync -avz --exclude='.env' -e "ssh -i $HOME/.ssh/id_rsa" ./backend/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/backend/
          ssh -i $HOME/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/backend
            npm install --omit=dev
            npm run build
            pm2 delete backend || true
            pm2 start npm --name backend -- start
          EOF

name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_ROLE_ARN: arn:aws:iam::476287788555:role/zendcraft-github-deploy
  ARTIFACTS_BUCKET: zendcraft-deploy-artifacts-476287788555
  INSTANCE_ID: i-0cf04dcdd635c4d73

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build
        working-directory: backend
        run: |
          npm ci
          npm run build
          echo "${{ github.sha }}" > version.txt
          tar -czf "../backend-${{ github.sha }}.tar.gz" dist package.json package-lock.json version.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build
        run: aws s3 cp "backend-${{ github.sha }}.tar.gz" "s3://${ARTIFACTS_BUCKET}/backend/${{ github.sha }}.tar.gz"

      - name: Install build on the instance
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name zendcraft-deploy-backend \
            --parameters "ArtifactKey=backend/${{ github.sha }}.tar.gz" \
            --comment "Deploy ${{ github.sha }}" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text

          status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          test "$status" = "Success"

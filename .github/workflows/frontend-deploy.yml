name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_ROLE_ARN: arn:aws:iam::476287788555:role/zendcraft-github-deploy
  SITE_BUCKET: www.zendcraft.net
  DISTRIBUTION_ID: E1S67IML931NSV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed build files never change, so browsers can cache them forever. Old ones are
      # kept so pages already open in a browser keep working after a deploy.
      - name: Upload build assets
        run: |
          aws s3 sync frontend/out/_next/static "s3://${SITE_BUCKET}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"

      # Everything else (HTML, images) must be revalidated so visitors get the new pages.
      - name: Upload pages
        run: |
          aws s3 sync frontend/out "s3://${SITE_BUCKET}" --delete \
            --exclude "_next/static/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
